<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EBEFEA">
<title>Classroom</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{--paper:#EBEFEA;--sheet:#fff;--ink:#1B2425;--muted:#5d6b68;--rule:#D5DCD6;--right:#1D7A50;--right-soft:#DDF1E6;--wrong:#B2412A;--wrong-soft:#F8E1DA;--acc:#2F5BD3;--acc-soft:#E3EAFB;--gold:#F5C518;--seg0:#C9D1CB;
  --h:'Kanit',system-ui,sans-serif;--b:'Sarabun',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#121717;--sheet:#1A2121;--ink:#E4EBE9;--muted:#9aa8a4;--rule:#2C3636;--right:#4FC48D;--right-soft:#16342A;--wrong:#F2805F;--wrong-soft:#3B211B;--acc:#7EA2F5;--acc-soft:#1d2a47;--seg0:#3a4646}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--b);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.h{font-family:var(--h);font-weight:600;line-height:1.3;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:780px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.top .logo{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.top .logo img{width:30px;height:30px;border-radius:8px}
.top h1{font-size:22px}
.top .sp{flex:1}
.btn{border:1.5px solid var(--rule);background:var(--sheet);border-radius:9px;padding:6px 12px;font-family:var(--h);font-weight:500;font-size:14px;line-height:1.3}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.danger{border-color:var(--wrong);color:var(--wrong)}
.modebtn{display:inline-flex;align-items:center;gap:8px;font:500 .9rem/1 var(--h);min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--mline);background:var(--sheet);color:var(--ink);cursor:pointer}
.modebtn .mdot{width:10px;height:10px;border-radius:50%;background:var(--mline)}
.modebtn[aria-pressed="true"]{background:var(--mbtn);color:var(--mbtn-ink);border-color:var(--mbtn)}
.modebtn[aria-pressed="true"] .mdot{background:#38D38E}
:root{--mline:#CDD6DE;--mbtn:#17212B;--mbtn-ink:#fff}
@media (prefers-color-scheme:dark){:root{--mline:#2D3844;--mbtn:#E6ECF1;--mbtn-ink:#10161C}}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);border-radius:999px;padding:2px 10px;font-family:var(--h);font-size:13px;background:var(--sheet)}
.muted{color:var(--muted)}
.card{background:var(--sheet);border:1.5px solid var(--rule);border-radius:12px;padding:14px 16px}
.banner{border:1.5px dashed var(--wrong);background:var(--wrong-soft);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:14.5px}
/* home launcher */
.launch{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.proj{position:relative;text-align:left;background:var(--sheet);border:1.5px solid var(--rule);border-radius:14px;padding:16px;min-height:132px;display:flex;flex-direction:column;gap:4px}
.proj .pt{font-family:var(--h);font-weight:700;font-size:24px;letter-spacing:.2px}
.proj .pt span{color:var(--acc)}
.proj .pd{font-size:14px;color:var(--muted)}
.proj .ps{margin-top:auto;font-size:14px;font-family:var(--h)}
.proj.tool .pt{font-size:19px}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.calhead h2{font-size:24px}.calhead h2 span{color:var(--acc)}
.calhead .sp{flex:1}
.game{display:inline-flex;gap:10px;font-family:var(--h);font-size:17px;align-items:center}
.game i{font-style:normal;font-weight:700}
.game .fire:not(.on){filter:grayscale(.65) opacity(.45)}
.game .fire:not(.on) i{color:var(--wrong)}
.game .fire.frz{filter:opacity(.55)}.game .fire.frz .ff{filter:hue-rotate(185deg) saturate(1.3)}.game .fire.frz i{color:#1E6FD9}
.mnav{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.mnav b{font-family:var(--h);font-size:17px;flex:1;text-align:center}
.cal{border:1.5px solid var(--rule);background:var(--sheet);border-radius:14px;padding:10px 8px 12px;transition:background-color .3s}
.cal.good{border-color:var(--right);background:var(--right-soft)}
.cal.bad{border-color:var(--wrong);background:var(--wrong-soft)}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 2px}
.cgrid .wd{text-align:center;font-family:var(--h);font-size:12.5px;color:var(--muted);padding-bottom:2px}
.cday{background:none;border:0;padding:0;display:flex;justify-content:center;align-items:center;aspect-ratio:1;min-width:0}
.cday:disabled{cursor:default}
.ring{width:100%;max-width:58px;height:auto;overflow:visible}
.ring .sg{fill:none;stroke-width:3.4;stroke-linecap:butt}
.ring .sg.e{stroke:var(--seg0)}.ring .sg.g{stroke:var(--right)}.ring .sg.r{stroke:var(--wrong)}.ring .sg.q{stroke:var(--acc);opacity:.45}
.ring .rg0{fill:none;stroke:var(--seg0);stroke-width:1.2}
.ring .rn{font-family:var(--b);font-size:12.5px;text-anchor:middle;dominant-baseline:middle;fill:var(--ink)}
.cday.fut .ring{opacity:.42}
.cday.td .rn{font-weight:700;fill:var(--acc)}
.cday.td .ring{filter:drop-shadow(0 0 0 transparent)}
.cday.out{visibility:hidden}
.calfoot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:12px 0 0;font-size:14.5px}
.calfoot .todo.ok{color:var(--right)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span::before{content:'';display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:3px;background:var(--c)}
/* screen-edge fx: gold edge + inward glow, aura random pastel inward */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;transition:box-shadow .4s}
#fx.gold{box-shadow:inset 0 0 0 4px var(--gold),inset 0 0 22px 8px rgba(245,197,24,.7)}
#fx.aura{box-shadow:inset 0 0 50px 18px var(--aura),inset 0 0 110px 44px var(--aura2),inset 0 0 180px 80px var(--aura3)}
#fx.gold.aura{box-shadow:inset 0 0 0 4px var(--gold),inset 0 0 22px 8px rgba(245,197,24,.7),inset 0 0 60px 24px var(--aura),inset 0 0 120px 50px var(--aura2),inset 0 0 190px 86px var(--aura3)}
/* day page */
.dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dhead h2{font-size:20px;flex:1;min-width:150px}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.qn{width:38px;height:38px;border-radius:50%;border:2px solid var(--rule);background:var(--sheet);font-family:var(--h);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0}
.qn.cur{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.qn.g{background:var(--right);border-color:var(--right);color:#fff}
.qn.r{background:var(--wrong);border-color:var(--wrong);color:#fff}
.qcard{background:var(--sheet);border:1.5px solid var(--rule);border-radius:14px;padding:14px 16px 16px}
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.sj{font-family:var(--h);font-weight:600;font-size:14px;color:#fff;background:var(--sj);border-radius:7px;padding:2px 10px}
.qno{font-family:var(--h);font-weight:600;font-size:16px}
.stars{color:#E0A100;letter-spacing:1px;font-size:14px}
.trk{font-family:var(--h);font-size:12px;border:1.5px solid #E0A100;color:#9A6B00;border-radius:6px;padding:0 6px}
.chn{font-size:13px;color:var(--muted)}
.qtext{font-size:17px;line-height:1.7}
.qtext p,.sol p{margin:.45em 0}
.qtext img,.sol img{max-width:100%}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:9px 12px;font-size:16px;line-height:1.55}
.opt .ol{font-family:var(--h);font-weight:600;min-width:20px}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.ok{border-color:var(--right);background:var(--right-soft)}
.opt.no{border-color:var(--wrong);background:var(--wrong-soft)}
.opt:disabled{cursor:default;opacity:1}
.qact{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.qact .sp{flex:1}
.err{color:var(--wrong);font-size:14px}
.verdict{margin-top:14px;border-radius:10px;padding:9px 12px;font-family:var(--h);font-weight:600}
.verdict.g{background:var(--right-soft);color:var(--right)}.verdict.r{background:var(--wrong-soft);color:var(--wrong)}
.verdict small{font-family:var(--b);font-weight:400;color:var(--ink)}
.sol{margin-top:12px;border-top:1.5px solid var(--rule);padding-top:10px}
.sol h3{font-size:17px;margin:6px 0 4px}
.sol h4{font-size:15.5px;margin:10px 0 2px}
.sol aside,.qtext aside{border-left:4px solid var(--acc);background:var(--acc-soft);padding:6px 10px;margin:8px 0;border-radius:0}
.sol table,.qtext table{border-collapse:collapse;margin:8px 0;font-size:14.5px;width:100%;display:block;overflow-x:auto}
.sol td,.sol th,.qtext td,.qtext th{border:1px solid var(--rule);padding:4px 8px;text-align:left;vertical-align:top}
.sol th,.qtext th{font-family:var(--h);font-weight:500;background:var(--paper)}
.sum{margin-top:12px;background:var(--paper);border-radius:10px;padding:10px 12px}
.sum h3{color:var(--acc)}
.who{margin-top:12px;font-size:14px}
.who li{margin:2px 0}
.lock{text-align:center;padding:30px 10px}
.lock .big{font-family:var(--h);font-size:20px}
/* stats */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0 14px}
.kpi{background:var(--sheet);border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:13px;color:var(--muted)}.kpi .v{font-family:var(--h);font-weight:600;font-size:22px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--sheet);border-radius:10px;overflow:hidden}
.tbl th,.tbl td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left}
.tbl th{font-family:var(--h);font-weight:500;background:var(--paper)}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl td:first-child{white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--seg0);overflow:hidden;min-width:50px}.bar i{display:block;height:100%;background:var(--right)}
details.tg{margin:12px 0;background:var(--sheet);border:1.5px solid var(--rule);border-radius:12px;padding:8px 12px}
details.tg summary{font-family:var(--h);font-weight:500;cursor:pointer}
.sec{font-size:18px;margin:18px 0 6px}
.kidchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.kidchips .chip{cursor:pointer;white-space:nowrap}
.kidchips .chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--c)}
/* kids */
.krow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.krow .nm{flex:1;min-width:140px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .pane{background:var(--sheet);width:100%;max-width:780px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 28px}
@media (min-width:700px){#sheet{align-items:center}#sheet .pane{border-radius:16px}}
.pane h3{font-size:19px;margin-bottom:10px}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-family:var(--h);font-size:14px;margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:15px;border:1.5px solid var(--rule);border-radius:8px;padding:7px 9px;background:var(--sheet);color:var(--ink)}
.fld textarea{min-height:70px;resize:vertical}
.fld input[type=radio],.fld input[type=checkbox]{width:auto;flex:0 0 auto}
.fld textarea.tall{min-height:180px}
.optin{display:flex;gap:6px;align-items:center;margin:5px 0}
.optin input[type=text]{flex:1}
.warn{border:1.5px solid #E0A100;background:#FFF6D8;color:#6b4f00;border-radius:8px;padding:6px 10px;font-size:14px;margin:8px 0}
@media (prefers-color-scheme:dark){.warn{background:#3a2f0a;color:#f3d97a}}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw label{display:inline-flex}.sw input{display:none}.sw span{width:26px;height:26px;border-radius:50%;background:var(--c);border:3px solid transparent}.sw input:checked+span{border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-size:14.5px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#upd{position:fixed;top:0;left:0;right:0;z-index:95;background:#FFD43B;color:#3b2f00;border:0;font-family:var(--h);font-weight:600;font-size:15px;padding:9px 12px;text-align:center}
#siteFoot{text-align:center;font-size:13px;color:var(--muted);padding:6px 0 26px}
.ld{padding:60px 0;text-align:center;color:var(--muted)}
.katex{font-size:1.04em}
</style>
</head>
<body>
<div id="app"><div class="ld">กำลังโหลด…</div></div>
<div id="fx"></div>
<div id="sheet" hidden></div>
<div id="toast"></div>
<footer id="siteFoot"></footer>

<script>
/* ===== Classroom (ext-class) · Project TU = TUtoday (เริ่ม 23 พ.ย. 2026) =====
   หน้าแรก = กล่องโปรเจกต์ (ตอนนี้มี TUtoday อย่างเดียว) · หน้าห้องเรียนเดิมลบแล้ว (ย้อนได้ด้วย //undo project tu = git tag pre-project-tu)
   นักเรียนเข้าด้วยลิงก์ส่วนตัว ?s=KEY (รหัส 16 ตัว) เห็นแค่ของตัวเอง · โหมดพี่ = Google login ที่อยู่ใน cls_meta/admins (หรือพี่ของ Baan Suay)
   คำตอบ TUtoday: cls_s_KEY/tu_<วันที่>_<ช่อง>_<qid> (สร้างครั้งเดียว แก้ไม่ได้) · โจทย์ที่พี่ใส่เอง: cls_lessons/tu_<วันที่> {slots:{ช่อง:โจทย์}} */
const SITE_UPDATED='2026-11-23T23:10:00+07:00';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('cls6.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('cls6.'+k,JSON.stringify(v))}catch(e){}}};
const KEYRE=/^[A-Za-z0-9]{16}$/;
const ME=(()=>{try{const u=new URL(location.href);const k=u.searchParams.get('s');if(k&&KEYRE.test(k)){LS.set('me',k);u.searchParams.delete('s');history.replaceState(null,'',u.pathname+u.search+u.hash)}}catch(e){}
  let v=LS.get('me','');if(!v){try{v=localStorage.getItem('cls6.me')||''}catch(e){}}return KEYRE.test(v)?v:''})();
function newKey(){const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';const r=crypto.getRandomValues(new Uint8Array(16));return Array.from(r,x=>A[x%A.length]).join('')}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SWATCHES=['#2F5BD3','#D23F77','#D9940F','#23935F','#7650CC','#E5612A','#0E8C9C','#8A6A3B','#C2416B','#4A5868'];
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- time: a TUtoday day runs 07:30 → 07:29:59 next morning (Bangkok) ---------- */
const HR=3600e3;
const ymd=d=>d.toISOString().slice(0,10);
const dayOf=t=>ymd(new Date(t+7*HR-7.5*HR));
const today=()=>dayOf(Date.now());
const addDay=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return ymd(t)};
const nextOpen=()=>Date.parse(addDay(today(),1)+'T00:30:00Z');
const hms=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')};
const TH_M=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D=['อา','จ','อ','พ','พฤ','ศ','ส'];
const TH_DL=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const thDate=(d,long)=>{const t=new Date(d+'T00:00:00Z');return (long?'วัน'+TH_DL[t.getUTCDay()]+'ที่ ':'')+t.getUTCDate()+' '+(long?TH_M:TH_MS)[t.getUTCMonth()]+' '+(t.getUTCFullYear()+543)};
const fmtTime=iso=>{const d=new Date(iso);if(isNaN(d))return iso;try{return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Bangkok'})+' เวลา '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'})+' น.'}catch(e){return iso}};

/* ---------- subjects / slots ---------- */
const SUBJ={phys:{n:'ฟิสิกส์',c:'#2563EB'},chem:{n:'เคมี',c:'#7C3AED'},bio:{n:'ชีววิทยา',c:'#15803D'},math:{n:'คณิตศาสตร์',c:'#C2410C'},eng:{n:'ภาษาอังกฤษ',c:'#0F766E'},thai:{n:'ภาษาไทย',c:'#BE185D'},soc:{n:'สังคมศึกษา',c:'#A16207'}};
const SUBJ_ORDER=['phys','chem','bio','math','eng','thai','soc'];

/* ---------- seeded shuffles: fixed per student per day ---------- */
function hrng(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0}}
function shuf(a,seed){const r=hrng(seed);a=a.slice();for(let i=a.length-1;i>0;i--){const j=r()%(i+1);const t=a[i];a[i]=a[j];a[j]=t}return a}

let KIDS={};        /* id -> kid (brother) · student: just themself */

function dayQs(d){const base=(window.TU_CLONE||{})[d]||d;const st=(window.TU_DAYS||{})[base]||{};
  const o1=(OV[base]&&OV[base].slots)||{},o2=base!==d?((OV[d]&&OV[d].slots)||{}):{};
  return SLOTS.map(sl=>{const q=o2[sl.k]||o1[sl.k]||st[sl.k];return q&&q.q&&q.c?Object.assign({slot:sl.k,subj:sl.s,own:!!(o2[sl.k]||o1[sl.k])},q):null}).filter(Boolean)}
const aid=(d,q)=>'tu_'+d+'_'+q.slot+'_'+q.qid;
const permOf=(key,d,q)=>key?shuf([0,1,2,3],key+'|'+d+'|'+q.slot+'|'+q.qid):[0,1,2,3];
const orderOf=(key,d)=>{const qs=dayQs(d);return key?shuf(qs,key+'|'+d):qs};
const ansOf=(key,d,q)=>key&&ANS[key]?ANS[key][aid(d,q)]:null;
const isOk=(a,q)=>!!a&&a.pick===q.a;
function kidByKey(k){return Object.values(KIDS).find(x=>x.key===k)}

/* fire / medal per student (same rules as Morning round, on-time first answers only) */
function game(key){const A=(key&&ANS[key])||{},days={};
  for(const id in A){const x=A[id];if(!x||x.kind!=='tu')continue;const qs=dayQs(x.date);const q=qs.find(q=>q.slot===x.slot&&q.qid===x.qid);if(!q)continue;
    const D=days[x.date]=days[x.date]||{n:qs.length,done:0,right:0,ot:0,otr:0};const ok=isOk(x,q);D.done++;if(ok)D.right++;if(x.ot){D.ot++;if(ok)D.otr++}}
  const td=today(),has=d=>dayQs(d).length>0;
  const lit=d=>!!days[d]&&days[d].ot>=need(days[d].n,LIT_K);
  const ks=Object.keys(days).filter(lit).sort();let fire=0,best=0,risk=false;const end={};
  if(ks.length){let miss=0;for(let d=ks[0];d<td;d=addDay(d,1)){if(!has(d))continue;if(lit(d)){fire++;miss=0}else if(++miss>=2)fire=0;best=Math.max(best,fire);end[d]={f:fire,s:lit(d)?'on':fire>0?'frz':'out'}}
    risk=miss===1&&fire>0&&!lit(td);if(lit(td))fire++;best=Math.max(best,fire)}
  const medals=Object.keys(days).filter(d=>days[d].otr>=need(days[d].n,MED_K)).length;
  return {fire,best,on:lit(td),risk,end,medals,days}}
const auraVars=(key,d)=>{const h=hrng((key||'')+'|aura|'+d)()%360;return {'--aura':`hsla(${h},90%,84%,.95)`,'--aura2':`hsla(${(h+30)%360},90%,87%,.7)`,'--aura3':`hsla(${(h+60)%360},90%,91%,.5)`}};

/* ---------- tiny markdown (+ $math$ via KaTeX) ---------- */
function md(src){if(!src)return '';const M=[];
  let s=String(src).replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g,m=>{M.push(m);return '\u0000'+(M.length-1)+'\u0001'});
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\w)/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const out=[];
  const block=L=>{if(!L.length)return;
    if(/^#{1,4}\s/.test(L[0])){out.push('<h4>'+inl(L[0].replace(/^#+\s*/,''))+'</h4>');return block(L.slice(1))}
    const run=(re,fn)=>{let i=0;while(i<L.length&&re.test(L[i]))i++;if(!i)return false;fn(L.slice(0,i));block(L.slice(i));return true};
    if(run(/^\s*[-•]\s+/,x=>out.push('<ul>'+x.map(l=>'<li>'+inl(l.replace(/^\s*[-•]\s+/,''))+'</li>').join('')+'</ul>')))return;
    if(run(/^\s*\d+[.)]\s+/,x=>out.push('<ol>'+x.map(l=>'<li>'+inl(l.replace(/^\s*\d+[.)]\s+/,''))+'</li>').join('')+'</ol>')))return;
    if(run(/^\s*\|.*\|\s*$/,x=>{const rows=x.filter(l=>!/^\s*\|[\s:|-]+\|\s*$/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|'));
      out.push('<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>i?'<td>'+inl(c.trim())+'</td>':'<th>'+inl(c.trim())+'</th>').join('')+'</tr>').join('')+'</table>')}))return;
    if(run(/^>\s?/,x=>out.push('<aside>'+inl(x.map(l=>l.replace(/^>\s?/,'')).join('<br>'))+'</aside>')))return;
    let i=0;while(i<L.length&&!/^(#{1,4}\s|\s*[-•]\s+|\s*\d+[.)]\s+|\s*\|.*\|\s*$|>\s?)/.test(L[i]))i++;
    if(!i)i=1;out.push('<p>'+inl(L.slice(0,i).join('<br>'))+'</p>');block(L.slice(i))};
  s.split(/\n\s*\n/).forEach(b=>block(b.split('\n')));
  return out.join('').replace(/\u0000(\d+)\u0001/g,(_,i)=>M[+i])}
function typeset(){try{if(window.renderMathInElement){const o={delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false};
  renderMathInElement($('#app'),o);if(!$('#sheet').hidden)renderMathInElement($('#sheet'),o)}}catch(e){}}

/* ---------- ring: 9 equal pieces around the date, from the top going down the left side and back up the right ---------- */
function ring(st,num){const n=st.length,R=17,C=20;let p='';
  if(!n)p=`<circle cx="20" cy="20" r="${R}" class="rg0"/>`;
  else if(n===1)p=`<circle cx="20" cy="20" r="${R}" class="sg ${st[0]}"/>`;
  else{const s=360/n,g=7,P=a=>{const r=a*Math.PI/180;return (C+R*Math.sin(r)).toFixed(2)+' '+(C-R*Math.cos(r)).toFixed(2)};
    st.forEach((v,i)=>{const a1=-(i+1)*s+g/2,a2=-i*s-g/2;p+=`<path d="M${P(a1)}A${R} ${R} 0 0 1 ${P(a2)}" class="sg ${v}"/>`})}
  return `<svg viewBox="0 0 40 40" class="ring" aria-hidden="true">${p}<text x="20" y="20.5" class="rn">${num}</text></svg>`}
function dayStatus(key,d){return orderOf(key,d).map(q=>{if(!key)return 'q';const a=ansOf(key,d,q);return a?(isOk(a,q)?'g':'r'):'e'})}

function viewDay(){const d=S.day,td=today(),bro=S.bro,key=VK();
  if(!d)return viewCal();
  const back=`<button class="btn sm" data-a="go" data-v="cal">← ปฏิทิน</button>`;
  if(d>td&&!bro)return `<div class="dhead">${back}</div><div class="card lock"><div class="big">ยังไม่ถึงวัน</div><p class="muted">ชุดของ${thDate(d,true)} เปิด 07:30 น. ทำล่วงหน้าไม่ได้</p></div>`;
  const qs=orderOf(key,d);
  if(!qs.length)return `<div class="dhead">${back}<h2>${thDate(d,true)}</h2></div><div class="card lock"><div class="big">วันนี้ยังไม่มีโจทย์</div>${bro?`<p><button class="btn primary" data-a="edit" data-d="${d}" data-k="phys">ใส่โจทย์เอง</button></p>`:''}</div>`;
  if(S.qi>=qs.length)S.qi=qs.length-1;if(S.qi<0)S.qi=0;
  const q=qs[S.qi],a=ansOf(key,d,q),pm=permOf(key,d,q),showAll=bro&&!key,revealed=!!a||showAll;

function statsFor(key){const A=(key&&ANS[key])||{},td=today(),G=game(key),items=[];

  const agg=f=>{const o={};items.forEach(it=>{const k=f(it);if(k==null)return;const r=o[k]=o[k]||{n:0,r:0,ms:0,mn:0};r.n++;if(it.ok)r.r++;if(it.x.ms){r.ms+=it.x.ms;r.mn++}});return o};
  let open=0,skipped=0,full=0;const days=new Set();
  Object.keys(Object.assign({},window.TU_DAYS||{},window.TU_CLONE||{},OV)).forEach(d=>{if(d>td)return;const qs=dayQs(d);if(!qs.length)return;days.add(d);open+=qs.length;const n=qs.filter(q=>A[aid(d,q)]).length;if(n===qs.length)full++;if(d<td)skipped+=qs.length-n});
  const ms=items.filter(i=>i.x.ms);
  return {G,items,n:items.length,r:items.filter(i=>i.ok).length,late:items.filter(i=>!i.x.ot).length,avg:ms.length?ms.reduce((s,i)=>s+i.x.ms,0)/ms.length:0,
    subj:agg(i=>i.q.subj),ch:agg(i=>i.q.ch?i.q.subj+'|'+i.q.ch:null),trick:agg(i=>i.q.trick?'t':null).t||{n:0,r:0},open,skipped,full,days:[...days].sort().reverse()}}

      if(chOfDay(addDay(d,1),s).includes(ch))w.push('บทนี้ออกพรุ่งนี้ ('+thDate(addDay(d,1))+')');
      if(chOfDay(d,s,val('eSlot')).includes(ch))w.push('อีกข้อของวิชานี้ในวันเดียวกันใช้บทนี้แล้ว')}
    $('#eWarn').innerHTML=w.length?`<div class="warn">⚠ ผิดกฎสุ่มหัวข้อ: ${w.join(' · ')}</div>`:''};
  $('#eCh').onchange=chk;$('#eSlot').onchange=()=>{const k2=val('eSlot');closeSheet();editForm(d,k2)};chk()}
function dayEditList(d){const qs=dayQs(d);
  openSheet(`<h3>โจทย์ทั้งวัน · ${thDate(d,true)}</h3><div class="card">${SLOTS.map(sl=>{const q=qs.find(x=>x.slot===sl.k);
    return `<div class="krow"><span class="dot" style="--c:${SUBJ[sl.s].c}"></span><span class="nm"><b>${SUBJ[sl.s].n}${/\d$/.test(sl.k)?' '+sl.k.slice(-1):''}</b> <span class="muted">${q?esc(chName(sl.s,q.ch)||'ไม่ระบุบท')+(q.own?' · พี่ใส่เอง':''):'ยังไม่มีโจทย์'}</span></span><button class="btn sm" data-a="edit" data-d="${d}" data-k="${sl.k}">${q?'แก้':'ใส่'}</button></div>`}).join('')}</div>
   <div style="margin-top:12px"><button class="btn" data-a="close">ปิด</button></div>`)}

/* ---------- actions ---------- */
const ACT={
  home(){S.view='home';render();scrollTo(0,0)},
  go(t){S.view=t.dataset.v;S.err='';render();scrollTo(0,0)},
  close(){closeSheet()},
  bro(){if(DB.mode==='test'){if(!DB.admin){toast('ไม่มีสิทธิ์');return}S.bro=!S.bro;LS.set('bro',S.bro);render();return}
    if(!S.bro&&!DB.admin){authSheet();return}S.bro=!S.bro;LS.set('bro',S.bro);render();toast(S.bro?'เปิดโหมดพี่แล้ว':'ปิดโหมดพี่แล้ว')},
  mon(t){const [y,m]=S.m.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+(+t.dataset.n),1));S.m=ymd(d).slice(0,7);render()},
  day(t){const d=t.dataset.d;if(d>today()&&!S.bro){toast('ยังไม่ถึงวัน — ชุดนี้เปิด 07:30 น. ของ'+thDate(d,true));return}S.day=d;S.view='day';S.err='';
    const key=VK(),qs=orderOf(key,d);const i=qs.findIndex(q=>!ansOf(key,d,q));S.qi=i<0?0:i;render();scrollTo(0,0)},
  qi(t){S.qi=+t.dataset.i;S.err='';render()},
  skip(){const qs=orderOf(VK(),S.day);S.qi=(S.qi+1)%qs.length;S.err='';render()},
  pick(t){const q=orderOf(VK(),S.day)[S.qi];S.pick[S.day+'|'+q.slot+'|'+q.qid]=+t.dataset.i;S.err='';render()},
  async submit(){const d=S.day,qs=orderOf(ME,d),q=qs[S.qi],pk=S.pick[d+'|'+q.slot+'|'+q.qid];
    if(pk==null){S.err='เลือกคำตอบก่อน';const e=$('#qerr');if(e)e.textContent=S.err;return}
    if(ansOf(ME,d,q))return;tAcc();const m=LS.get('ms',{}),id=aid(d,q),now=Date.now(),orig=permOf(ME,d,q)[pk];
    const doc={kind:'tu',date:d,slot:q.slot,qid:q.qid,subj:q.subj,ch:q.ch||'',pick:orig,ms:Math.round(m[id]||0),at:now,ot:dayOf(now)===d};
    try{await DB.addAnswer(ME,id,doc);delete m[id];LS.set('ms',m)}catch(e){delete (ANS[ME]||{})[id];toast('ส่งคำตอบไม่สำเร็จ ลองใหม่');render();return}
    render()},
  as(t){S.as=t.dataset.id;render()},
  statKid(t){S.statKid=t.dataset.id;render()},
  edit(t){closeSheet();editForm(t.dataset.d,t.dataset.k)},
  editday(t){dayEditList(t.dataset.d)},
  async saveQ(t){const d=t.dataset.d,k=val('eSlot'),c=[0,1,2,3].map(i=>val('eC'+i)),a=+((document.querySelector('input[name=eA]:checked')||{}).value||0);
    const q={qid:'o'+uid(),ch:val('eCh'),stars:Math.min(5,Math.max(1,+val('eStars')||4)),trick:!!(document.getElementById('eTrick')||{}).checked,q:val('eQ'),c,a,sol:val('eSol'),sum:val('eSum'),by:'bro',at:Date.now()};
    if(!q.q||c.some(x=>!x)){$('#eErr').textContent='ใส่โจทย์และตัวเลือกให้ครบ 4 ข้อ';return}
    if(!q.ch){$('#eErr').textContent='เลือกบทก่อน';return}
    try{await DB.saveSlot(d,k,q);closeSheet();toast('บันทึกแล้ว');render()}catch(e){$('#eErr').textContent='บันทึกไม่สำเร็จ ('+(e&&e.code||'error')+')'}},
  async delQ(t){try{await DB.delSlot(t.dataset.d,t.dataset.k);closeSheet();toast('ลบแล้ว');render()}catch(e){toast('ลบไม่สำเร็จ')}},
  kidForm(t){kidForm(t.dataset.id)},
  async saveKid(t){const nick=val('kNick'),code=val('kCode');if(!nick&&!code){$('#kErr').textContent='ใส่ชื่อเล่นหรือชื่อย่อก่อน';return}
    const id=t.dataset.id||(code||'kid').toLowerCase().replace(/[^a-z0-9]/g,'')+'-'+uid().slice(-4),old=KIDS[id]||{};
    const color=(document.querySelector('input[name=kCol]:checked')||{}).value||SWATCHES[0];
    const body=Object.assign({},old,{nick,code,grade:val('kGrade'),color,key:KEYRE.test(old.key||'')?old.key:newKey()});delete body.id;
    try{await DB.putKid(id,body,{kid:id,code,nick,grade:body.grade,color});closeSheet();toast('บันทึกแล้ว');render()}catch(e){$('#kErr').textContent='บันทึกไม่สำเร็จ ตรวจ Firestore Rules'}},
  async delKid(t){const k=KIDS[t.dataset.id];if(!k)return;if(!confirm('ลบ '+(k.nick||k.code)+' ? ผลข้อสอบของคนนี้จะเปิดดูไม่ได้อีก'))return;await DB.delKid(k);closeSheet();render()},
  async copy(t){try{await navigator.clipboard.writeText(t.dataset.t);toast('คัดลอกลิงก์แล้ว')}catch(e){prompt('คัดลอกลิงก์นี้',t.dataset.t)}},
  signIn(){const au=firebase.auth(),pv=new firebase.auth.GoogleAuthProvider();pv.setCustomParameters({prompt:'select_account'});
    au.signInWithPopup(pv).then(async()=>{await DB.afterAuth();if(DB.admin){S.bro=true;LS.set('bro',true);closeSheet();toast('เปิดโหมดพี่แล้ว');render()}else authSheet()})
      .catch(e=>{const c=e&&e.code||'';if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){au.signInWithRedirect(pv);return}
        if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;toast('ล็อกอินไม่สำเร็จ ('+c+')')})},
  async signOut(){const au=firebase.auth();S.bro=false;LS.set('bro',false);await au.signOut();await au.signInAnonymously();await DB.afterAuth();closeSheet();toast('ออกจากระบบแล้ว')},
  async reqAdmin(){const u=DB.user;try{await DB.db.collection('cls_adminRequests').doc(u.uid).set({name:u.displayName||'ไม่มีชื่อ',at:Date.now()});toast('ส่งคำขอแล้ว');closeSheet()}catch(e){toast('ส่งคำขอไม่สำเร็จ')}},
  async approve(t){const r=REQ[t.dataset.id];if(!r)return;const ref=DB.db.collection('cls_meta').doc('admins');const sn=await ref.get();const a=sn.exists?sn.data():{};
    await ref.set({uids:(a.uids||[]).filter(x=>x!==r.id).concat(r.id),names:Object.assign({},a.names||{},{[r.id]:r.name||'พี่'})},{merge:true});
    try{await DB.db.collection('cls_adminRequests').doc(r.id).delete()}catch(e){}toast('ให้สิทธิ์แล้ว')},
  async reject(t){try{await DB.db.collection('cls_adminRequests').doc(t.dataset.id).delete()}catch(e){toast('ลบคำขอไม่สำเร็จ')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=ACT[t.dataset.a];if(f){e.preventDefault();f(t)}});
document.addEventListener('keydown',e=>{if(S.view!=='day'||!$('#sheet').hidden)return;const tg=e.target;if(tg&&/INPUT|TEXTAREA|SELECT/.test(tg.tagName))return;
  const n=orderOf(VK(),S.day).length;if(e.key==='ArrowRight'&&S.qi<n-1){S.qi++;S.err='';render()}else if(e.key==='ArrowLeft'&&S.qi>0){S.qi--;S.err='';render()}});
/* clock + new round at 07:30 */
let lastDay=today();setInterval(()=>{const c=document.getElementById('clk');if(c)c.textContent=hms(nextOpen()-Date.now());if(today()!==lastDay){lastDay=today();render()}},1000);

/* ---------- footer + yellow new-version bar ---------- */
const verOf=()=>[SITE_UPDATED,window.TU_DATA_VER||''].sort().pop();
function foot(iso){$('#siteFoot').innerHTML='อัปเดตเว็บล่าสุด <time datetime="'+iso+'">'+fmtTime(iso)+'</time>'}
function updBar(){if($('#upd'))return;const b=document.createElement('button');b.id='upd';b.type='button';b.textContent='เว็บมีเวอร์ชันใหม่ — แตะเพื่อโหลดใหม่';b.onclick=()=>location.replace(location.pathname+'?v='+Date.now()+location.hash);document.body.appendChild(b)}
async function checkVer(){if(!/github\.io$/.test(location.hostname))return;
  try{const [a,b]=await Promise.all([fetch(location.pathname.replace(/[^/]*$/,'')+'index.html?chk='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():''),fetch('tu/days.js?chk='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'')]);
    const m1=a.match(/const SITE_UPDATED='([^']+)'/),m2=b.match(/TU_DATA_VER\s*=\s*'([^']+)'/);
    if((m1&&m1[1]>SITE_UPDATED)||(m2&&m2[1]>(window.TU_DATA_VER||'')))updBar()}catch(e){}}
function footInit(){foot(verOf());if(!/github\.io$/.test(location.hostname))return;
  fetch('https://api.github.com/repos/BankyPP/'+(location.pathname.split('/')[1]||'ext-class')+'/commits?per_page=1',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{const iso=j&&j[0]&&j[0].commit&&(j[0].commit.committer||j[0].commit.author||{}).date;if(iso)foot(iso)}).catch(()=>{});
  setTimeout(checkVer,4000);setInterval(checkVer,3*60e3)}

/* ---------- boot: data files always fresh (no stale questions) ---------- */
const loadJs=src=>new Promise(r=>{const s=document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'t='+Date.now();s.onload=r;s.onerror=r;document.head.appendChild(s)});
(async()=>{await Promise.all([loadJs('tu/syllabus.js'),loadJs('tu/days.js')]);window.TU_DAYS=window.TU_DAYS||{};footInit();
  if(S.view==='day'&&!S.day)S.view='cal';await DB.init();render();
  window.addEventListener('load',()=>setTimeout(typeset,50))})();
</script>
